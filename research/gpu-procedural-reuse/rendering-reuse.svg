<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
<rect width="1120" height="500" fill="#101923"/><text x="45" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#f3f6f9">One assembly, three rendering representations</text>
<g font-family="Arial,sans-serif" fill="#d8e5ef" font-size="19" text-anchor="middle"><text x="185" y="105">Full geometry</text><text x="560" y="105">Cached impostor</text><text x="935" y="105">Tiled material</text></g>
<g stroke="#7fb8cf" stroke-width="2">
<rect x="45" y="130" width="280" height="265" rx="12" fill="#1d2d3b"/><rect x="420" y="130" width="280" height="265" rx="12" fill="#1d2d3b"/><rect x="795" y="130" width="280" height="265" rx="12" fill="#1d2d3b"/>
</g>
<g fill="#4d819c" stroke="#c0dbe6" stroke-width="2"><path d="M110 290 L180 248 L260 289 L190 332 Z"/><path d="M110 290 L110 235 L180 194 L180 248 Z" fill="#2d607c"/><path d="M180 248 L180 194 L260 235 L260 289 Z" fill="#6d9eb7"/><rect x="136" y="208" width="22" height="53" transform="skewY(-25)" fill="#95b8c8"/><rect x="203" y="237" width="30" height="30" fill="#163a50"/></g>
<g><rect x="474" y="190" width="170" height="150" fill="#294d62" stroke="#b3d3e4" stroke-width="3"/><path d="M484 310 L634 218 M484 280 L634 188 M484 340 L634 248" stroke="#7fa9bf" stroke-width="10"/><text x="560" y="365" font-family="Arial" font-size="14" text-anchor="middle" fill="#c6d8e2">Cached view + depth</text></g>
<defs><pattern id="tile" width="62" height="62" patternUnits="userSpaceOnUse"><rect width="62" height="62" fill="#2c5067"/><rect x="5" y="5" width="52" height="52" fill="none" stroke="#8bb8cc" stroke-width="2"/><rect x="13" y="13" width="18" height="32" fill="#6d98af"/><path d="M37 17h13M37 25h13M37 33h13M37 41h13" stroke="#a9d0de" stroke-width="3"/></pattern></defs>
<rect x="825" y="170" width="220" height="185" fill="url(#tile)" stroke="#b3d3e4" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#a9c5d4"><text x="185" y="430">Accurate 3D + editability</text><text x="560" y="430">Reuse previously rendered views</text><text x="935" y="430">Repeat one baked tile</text></g>
<text x="560" y="477" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#8ea7b7">Conceptual illustration — not a performance benchmark</text>
</svg>